kind = "web"
previewPath = "/_naver_vite_internal"
title = "네이버 뉴스 클론"
version = "1.0.0"
id = "artifacts/naver-news"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/_naver_vite_internal" ]
localPort = 23849

[services.development]
run = "pnpm --filter @workspace/naver-news run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/naver-news", "run", "build" ]
publicDir = "artifacts/naver-news/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23849"
BASE_PATH = "/"
